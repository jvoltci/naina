[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.11"]
build-backend = "scikit_build_core.build"

[project]
name = "naina"
version = "0.2.1"
description = "Embeddable document-reading runtime. OCR from one C++ core, no OpenCV."
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "JAI", email = "jvoltci@gmail.com" }]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Text Processing",
]
keywords = ["ocr", "document", "text-recognition", "paddleocr", "onnx", "layout"]
dependencies = [
    "numpy>=1.20",
]

[project.urls]
Homepage = "https://github.com/jvoltci/naina"
Source = "https://github.com/jvoltci/naina"
Documentation = "https://jvoltci.github.io/naina/doc/"
Demo = "https://jvoltci.github.io/naina/"
Changelog = "https://github.com/jvoltci/naina/blob/master/CHANGELOG.md"

[tool.scikit-build]
cmake.version = ">=3.24"
build.targets = ["naina-py"]
build-dir = "build/{wheel_tag}"
minimum-version = "build-system.requires"
wheel.packages = ["bindings/python/naina"]
wheel.install-dir = "naina"
editable.mode = "redirect"
editable.rebuild = true
# Pull yaml-cpp + libcurl from the system; the wheel just bundles libnaina + _binding.
sdist.include = [
    "core/**",
    "cmake/**",
    "bindings/python/**",
    "models/**",
    "CMakeLists.txt",
    "CMakePresets.json",
    "LICENSE",
    "README.md",
]
sdist.exclude = [
    "demo/",
    "docs/",
    "images/",
    "build/",
    "bindings/node/",       # Node binding lives in its own npm package
    "examples/",
    "benchmarks/results/",
    "**/__pycache__/",
    "**/.pytest_cache/",
    "**/node_modules/",
    "**/*.onnx",
    "**/.DS_Store",
]

[tool.scikit-build.cmake.define]
NAINA_BUILD_PYTHON = "ON"
NAINA_BUILD_TESTS = "OFF"
NAINA_BUILD_SHARED = "OFF"
# A wheel with no inference backend compiled in cannot read anything, so this
# is ON rather than inheriting the option's OFF default. Release-engineering
# note: this links the SYSTEM onnxruntime, so publishable wheels need it
# vendored (delocate on macOS, auditwheel on Linux) rather than assumed.
NAINA_WITH_ONNXRUNTIME = "ON"
# Static-link yaml-cpp so the extension carries no absolute path to a
# system copy. This is a CMake option, so it must be a cmake.define —
# scikit-build-core does not promote environment variables to CMake defines,
# which is exactly the mistake that left the first vendored build still
# pointing at /opt/homebrew/opt/yaml-cpp.
NAINA_VENDOR_YAMLCPP = "ON"
# A wheel is a distributable artifact with a pinned version, so
# naina.__version__ must match the wheel METADATA exactly.
NAINA_RELEASE = "ON"


# ── Redistributable wheels ────────────────────────────────────────────
#
# The problem this solves: a wheel built against a system ONNX Runtime and
# yaml-cpp links absolute paths like
# /opt/homebrew/opt/onnxruntime/lib/libonnxruntime.1.dylib. Anyone without that
# exact install — including every Intel Mac, where the Homebrew prefix differs —
# gets an ImportError on `import naina`. Verified, not hypothetical.
#
# Two dependencies, two treatments:
#   yaml-cpp     vendored STATICALLY, so the runtime dependency disappears
#   onnxruntime  too large to static-link; the shared library is bundled INTO
#                the wheel by delocate (macOS) / auditwheel (Linux), which
#                rewrite the load paths to point inside the wheel
[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_*"
build-frontend = "build"
# Prove the wheel is self-contained: import it in a clean environment and
# assert the extension carries no absolute path to a build-machine library.
test-requires = ["numpy", "pytest"]
test-command = "python {project}/tools/check_wheel_selfcontained.py && python -m pytest {project}/bindings/python/tests -q"

[tool.cibuildwheel.environment]
NAINA_VENDOR_YAMLCPP = "ON"
NAINA_WITH_ONNXRUNTIME = "ON"

[tool.cibuildwheel.macos]
# Fetch the official ORT release rather than relying on Homebrew, so the build
# does not depend on the runner's package manager or CPU architecture.
before-all = "bash {project}/tools/ci/install_onnxruntime.sh"
#
# DYLD_LIBRARY_PATH is what lets delocate resolve @rpath/libonnxruntime and copy
# it into the wheel. Without it the repair step fails with "not found" even
# though the file is right there.
#
# MACOSX_DEPLOYMENT_TARGET is 13.3 and that is NOT a free choice. ONNX Runtime
# 1.20.1's dylib is built with a minimum target of 13.3 on BOTH architectures,
# and delocate refuses to bundle it into a wheel claiming less -- correctly,
# because such a wheel would install happily on macOS 11 and then fail at import
# with a dyld error. Install-then-crash is worse than not building.
#
# The floor is ORT's, not naina's: naina's own code compiles for 11.0 without
# complaint. An earlier version of this file set 11.0 globally with a 13.3
# override for arm64 only, on the assumption that the x86_64 dylib was built
# lower. Measured: it is not. Both need 13.3, so there is no override.
#
# Revisit whenever the pinned ORT version moves; this number tracks that
# dependency.
environment = { NAINA_VENDOR_YAMLCPP = "ON", NAINA_WITH_ONNXRUNTIME = "ON", ONNXRUNTIME_ROOT = "/tmp/onnxruntime", MACOSX_DEPLOYMENT_TARGET = "13.3", DYLD_LIBRARY_PATH = "/tmp/onnxruntime/lib" }

[tool.cibuildwheel.linux]
# manylinux_2_28 (glibc 2.28, RHEL 8 era) rather than the default manylinux2014
# (glibc 2.17), because ONNX Runtime 1.20's Linux build references symbols newer
# than 2.17 and auditwheel refuses the repair:
#
#   cannot repair ... to "manylinux2014_x86_64" ABI because of the presence of
#   too-recent versioned symbols
#
# It is right to refuse. The floor is ORT's, not naina's -- the same way macOS
# arm64 has to declare 13.3 above. glibc 2.28 covers Ubuntu 20.04+, Debian 10+
# and RHEL 8+. Revisit when the pinned ORT version moves.
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
before-all = "bash {project}/tools/ci/install_build_deps.sh"
# LD_LIBRARY_PATH is the Linux counterpart of DYLD_LIBRARY_PATH above: auditwheel
# has to find libonnxruntime.so.1 in order to vendor it into the wheel, and
# without this it fails with "required library could not be located" even though
# before-all has just unpacked it. Both repair tools need telling where the
# bundled runtime lives.
environment = { NAINA_VENDOR_YAMLCPP = "ON", NAINA_WITH_ONNXRUNTIME = "ON", ONNXRUNTIME_ROOT = "/tmp/onnxruntime", LD_LIBRARY_PATH = "/tmp/onnxruntime/lib" }
