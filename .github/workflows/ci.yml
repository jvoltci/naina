name: CI

on:
  push:
    branches: [master, main]
    paths-ignore:
      - 'demo/**'
      - 'docs/**'
      - '*.md'
  pull_request:
    paths-ignore:
      - 'demo/**'
      - 'docs/**'
      - '*.md'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.preset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  preset: linux-x86_64,       cc: gcc,   cxx: g++ }
          - { os: ubuntu-latest,  preset: linux-x86_64-debug, cc: clang, cxx: clang++ }
          - { os: macos-14,       preset: macos-arm64,        cc: clang, cxx: clang++ }

    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      CMAKE_GENERATOR: Ninja

    steps:
      - uses: actions/checkout@v4

      - name: Install build deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake libyaml-cpp-dev libcurl4-openssl-dev

      # No apt package exists for ONNX Runtime, so take the upstream release
      # tarball. The presets enable the backend on every platform, because a
      # build without one cannot run inference and its tests pass vacuously.
      - name: Install ONNX Runtime (Linux)
        if: runner.os == 'Linux'
        env:
          ORT_VERSION: 1.20.1
        run: |
          set -euo pipefail
          curl -fsSL -o ort.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          sudo mkdir -p /usr/local
          sudo tar -xzf ort.tgz -C /usr/local --strip-components=1
          sudo ldconfig
          test -f /usr/local/include/onnxruntime_c_api.h

      - name: Install build deps (macOS)
        if: runner.os == 'macOS'
        # libcurl ships with macOS; nothing extra to install for it.
        run: brew install ninja cmake yaml-cpp onnxruntime

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      # Guard the trap that once hid a whole backend-less build: every test
      # either needs no backend or skips without one, so the suite reported
      # 100% green while the inference path was not compiled at all.
      - name: Assert an inference backend is compiled in
        run: |
          grep -q '^NAINA_WITH_ONNXRUNTIME:BOOL=ON$' \
            build/${{ matrix.preset }}/CMakeCache.txt

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}
        continue-on-error: false

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install clang-format (pinned via pip wheel)
        # pip's clang-format ships the upstream LLVM binary; pinning the version
        # makes local and CI deterministic.
        run: pip install clang-format==19.1.4
      - name: Check formatting
        run: |
          mapfile -t files < <(git ls-files 'core/**/*.h' 'core/**/*.hpp' 'core/**/*.cc' 'core/**/*.c')
          if [ ${#files[@]} -gt 0 ]; then
            clang-format --version
            clang-format --dry-run --Werror "${files[@]}"
          fi

  python:
    name: python ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake libyaml-cpp-dev libcurl4-openssl-dev
      # pyproject sets NAINA_WITH_ONNXRUNTIME=ON, since a wheel with no
      # inference backend cannot read anything.
      - name: Install ONNX Runtime (Linux)
        if: runner.os == 'Linux'
        env:
          ORT_VERSION: 1.20.1
        run: |
          set -euo pipefail
          curl -fsSL -o ort.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          sudo mkdir -p /usr/local
          sudo tar -xzf ort.tgz -C /usr/local --strip-components=1
          sudo ldconfig
      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja cmake yaml-cpp onnxruntime

      - name: pip install naina
        # Plain install (not editable) so it runs through the full sdist path
        # the way end-users would.
        run: pip install -v .

      - name: Smoke tests
        run: |
          pip install pytest numpy
          python -m pytest bindings/python/tests/ -v

  node:
    name: node ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: bindings/node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bindings/node/package-lock.json

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake libyaml-cpp-dev libcurl4-openssl-dev

      # The node addon builds with the same presets as the library, and those
      # require an inference backend -- a build without one produces an addon
      # that cannot read anything. Apt has no onnxruntime package, so install
      # upstream's tarball, matching the library job.
      - name: Install ONNX Runtime (Linux)
        if: runner.os == 'Linux'
        run: |
          ORT_VERSION=1.20.1
          curl -fsSL -o ort.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          tar -xzf ort.tgz
          sudo cp -r onnxruntime-linux-x64-${ORT_VERSION}/include/* /usr/local/include/
          sudo cp -r onnxruntime-linux-x64-${ORT_VERSION}/lib/*     /usr/local/lib/
          sudo ldconfig
          test -f /usr/local/include/onnxruntime_c_api.h

      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja cmake yaml-cpp onnxruntime

      - name: npm install
        run: npm install --no-audit --no-fund

      - name: Build native + ts
        run: npm run build

      - name: Test
        run: npx vitest run

  rust:
    name: rust ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: bindings/rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake libyaml-cpp-dev libcurl4-openssl-dev
      - name: Install ONNX Runtime (Linux)
        if: runner.os == 'Linux'
        run: |
          ORT_VERSION=1.20.1
          curl -fsSL -o ort.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          tar -xzf ort.tgz
          sudo cp -r onnxruntime-linux-x64-${ORT_VERSION}/include/* /usr/local/include/
          sudo cp -r onnxruntime-linux-x64-${ORT_VERSION}/lib/*     /usr/local/lib/
          sudo ldconfig
      - name: Install system deps (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja cmake yaml-cpp onnxruntime

      # Builds the core from source through build.rs, which is the path a
      # crates.io user takes — so CI exercises what they will, not a shortcut.
      - name: Vendor the core
        run: ./vendor.sh

      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  manifest-schema:
    name: validate model registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install validators
        run: pip install jsonschema pyyaml
      - name: Validate models/registry.yaml
        run: |
          python - <<'PY'
          import json, yaml, sys
          from jsonschema import Draft202012Validator
          schema = json.load(open('models/manifest.schema.json'))
          data   = yaml.safe_load(open('models/registry.yaml'))
          errs = sorted(Draft202012Validator(schema).iter_errors(data),
                        key=lambda e: list(e.path))
          if errs:
              for e in errs:
                  print(f"  • {'/'.join(str(p) for p in e.path) or '<root>'}: {e.message}")
              sys.exit(1)
          print("registry.yaml validates")
          PY
