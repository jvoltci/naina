  # ─── Text recognition (PP-OCRv6 rec, CTC head) ──────────────────────
  #
  # Input  "x"            f32 [N, 3, 48, W]  — height FIXED at 48
  # Output "fetch_name_0" f32 [N, T, C]      — T ≈ W/8
  #
  # C is NOT constant across tiers. Verified by loading each ONNX graph:
  #   tiny          6906 classes =  6904 chars + blank + space
  #   small/medium 18710 classes = 18708 chars + blank + space
  #
  # Class layout follows PaddleOCR's CTCLabelDecode: index 0 is the CTC
  # blank, charset entry i maps to class i+1, and the last class is a space
  # (use_space_char). Getting num_classes wrong shifts every character in
  # the output, so this is per-tier data, not a shared constant.
  #
  # The charset lives in each model's own inference.yml under
  # PostProcess.character_dict. Rather than commit a derived copy, the
  # manifest fetches that file as the `charset_yaml` kind and verifies it by
  # sha256 like any other artifact. small and medium share an identical
  # charset but ship byte-different yml files (the model_name field differs
  # by one byte), so each carries its own hash.
  #
  # tiny's charset is far smaller — mostly CJK and Latin — so the
  # "50 languages" claim applies to small and medium only.

  # ── Additional scripts ────────────────────────────────────────────
  #
  # One recognition model per script, selected by `lang`. Detection and layout
  # are script-agnostic and shared: measured on a Devanagari page, DBNet located
  # all 82 lines correctly even while the wrong recogniser produced garbage. So
  # adding a script costs one model, not three.
  #
  # All PP-OCRv5 mobile, because that is what upstream ships per script and only
  # in one size — every tier therefore shares one model per language. Each was
  # verified against naina's existing recognition path before being added:
  # [N,3,48,W] input, CTCLabelDecode, and num_classes == dict + 2 once charset.cc
  # prepends blank and appends space.
  #
  # NOT a licence axis: every model here is Apache-2.0.

  # Arabic, Persian, Urdu
  - id: text_recognize.arabic
    task: text_recognize
    tier: tiny
    lang: arabic
    arch: pp_ocrv5_rec
    license: Apache-2.0
    paper: "PP-OCRv5"
    files:
      onnx:
        url:        "${release_base}/ppocrv5_arabic_rec.onnx"
        source_url: "${hf}/arabic_PP-OCRv5_mobile_rec_onnx/resolve/main/inference.onnx"
        sha256:     "799113ebf267fbe742deb99eb36e8d42c9ddc5291ceacf92add41b4d52a59110"
        bytes:      7998947
      charset_yaml:
        url:        "${release_base}/ppocrv5_arabic_rec.yml"
        source_url: "${hf}/arabic_PP-OCRv5_mobile_rec_onnx/resolve/main/inference.yml"
        sha256:     "21368419e6c016c31db55d316d59e11c128e1913e6e6fe10287084710043d3a6"
        bytes:      6165
    input:
      shape:  [-1, 3, 48, -1]
      pixfmt: bgr
      dtype:  f32
      preprocess:
        height:    48
        max_width: 1200
        scale: [0.00392156862745098, 0.00392156862745098, 0.00392156862745098]
        mean:  [0.5, 0.5, 0.5]
        std:   [0.5, 0.5, 0.5]
    output:
      type: ctc_logits
      postprocess:
        blank_index: 0
        num_classes: 749

