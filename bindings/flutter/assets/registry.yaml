  # ─── Layout analysis (PP-DocLayout) ─────────────────────────────────
  #
  # All three tiers use the PP-DocLayout S/M/L family, which shares one
  # 23-class label list and one [N, 6] output of
  # [class_id, score, x1, y1, x2, y2] plus a detection count. One decode path,
  # one class mapping.
  #
  # PP-DocLayoutV3 was the original choice for medium and was DROPPED. It is a
  # different contract despite the similar name: [N, 7] rows carrying a mask
  # index, 25 classes rather than 23, and a 300x200x200 int32 mask output —
  # 48 MB that naina discards. L is the same size, same accuracy class, and
  # needs none of that special-casing. The V3 asset remains in the release but
  # is unreferenced.
  #
  # INPUTS still are not uniform, so the module feeds BY NAME from
  # session->inputs() rather than positionally:
  #
  #   S   image[1,3,480,480], scale_factor[1,2]
  #   M   image[1,3,640,640], scale_factor[1,2]
  #   L   im_shape[1,2], image[1,3,640,640], scale_factor[1,2]
  #
  # S and M carry NMS inside the graph, capping them at batch_size == 1.
  # Irrelevant here — layout runs one page at a time.
  #
  # S and M have no upstream ONNX build; naina exports them with
  # tools/paddle2onnx_layout.py. That export is byte-deterministic and verified
  # per-column against the Paddle original (classes exact, scores to 5e-7,
  # coordinates to 3e-4 px), so the artifact can be independently reproduced.

  - id: layout_detect.tiny
    task: layout_detect
    tier: tiny
    arch: pp_doclayout_s
    license: Apache-2.0
    files:
      onnx:
        url:        "${release_base}/ppdoclayout_s.onnx"
        source_url: "${hf}/PP-DocLayout-S/resolve/main/inference.pdiparams"
        sha256:     "f905a530dd36fe4ab6613457a52e75bca2bb8c3e3d53eb4cb902e21a2d4c2548"
        bytes:      4904714
    input:
      shape:  [1, 3, 480, 480]
      pixfmt: rgb
      dtype:  f32
      preprocess:
        scale: [0.00392156862745098, 0.00392156862745098, 0.00392156862745098]
        mean:  [0.485, 0.456, 0.406]
        std:   [0.229, 0.224, 0.225]
        resize: {mode: fixed, target: [480, 480]}
    output:
      type: layout_regions
      postprocess:
        score_thresh: 0.5

