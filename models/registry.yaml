# naina — Model Registry
#
# Source of truth for every model the runtime can load.
#
#   tier = tiny    → ~11 MB total. Browser, phone, Pi Zero.
#   tier = small   → ~54 MB total. Laptop, Pi 5, mobile app.
#   tier = medium  → ~269 MB total. Server, desktop.
#
# This is a DEVICE axis, not a licence axis. Every model here is Apache-2.0
# and safe for commercial use; what varies is size and the hardware it
# suits. (naina v0.1 used tier for permissive-vs-research weights; OCR has
# no such split, so the axis was repurposed.)
#
# Lookup happens by (task, tier). The runtime falls back to a larger tier
# when a task is missing at the requested one — layout_detect is
# medium-only until PP-DocLayout-S/-M are exported to ONNX.
#
# Every sha256 below was verified by downloading the artifact and hashing
# it. A truncated or substituted download fails closed rather than
# producing silently wrong output.
#
# Validated by models/manifest.schema.json. CI fails on schema violations.

schema_version: 1

defaults:
  cache_root: "${NAINA_CACHE:-~/.cache/naina/models}"
  release_base: "https://github.com/jvoltci/naina/releases/download/models-v1"
  # PaddleOCR publishes permissively-licensed ONNX exports on the Hugging
  # Face Hub. The `${hf}` placeholder resolves to this base URL.
  hf: "https://huggingface.co/PaddlePaddle"

models:

  # ─── Text detection (PP-OCRv6 det, DBNet head) ──────────────────────
  #
  # Input  "x"            f32 [N, 3, H, W]  — N/H/W all dynamic
  # Output "fetch_name_0" f32 [N, 1, H, W]  — single-channel probability map

  - id: text_detect.tiny
    task: text_detect
    tier: tiny
    arch: pp_ocrv6_det
    license: Apache-2.0
    paper: "PP-OCRv6, arXiv:2606.13108"
    files:
      onnx:
        url:    "${hf}/PP-OCRv6_tiny_det_onnx/resolve/main/inference.onnx"
        sha256: "193bab7a04fca699a6c82e6abb5b81bdb28177f0abd4062552b04908dafb19f8"
        bytes:  1780590
    input:
      shape:  [1, 3, -1, -1]
      pixfmt: bgr
      dtype:  f32
      preprocess:
        scale: [0.00392156862745098, 0.00392156862745098, 0.00392156862745098]
        mean:  [0.485, 0.456, 0.406]
        std:   [0.229, 0.224, 0.225]
        resize: {mode: limit_max_side, limit: 960, multiple_of: 32}
    output:
      type: db_probability_map
      postprocess:
        thresh:         0.2
        box_thresh:     0.4
        unclip_ratio:   1.4
        max_candidates: 3000

  - id: text_detect.small
    task: text_detect
    tier: small
    arch: pp_ocrv6_det
    license: Apache-2.0
    paper: "PP-OCRv6, arXiv:2606.13108"
    files:
      onnx:
        url:    "${hf}/PP-OCRv6_small_det_onnx/resolve/main/inference.onnx"
        sha256: "d73e0058b7a8086bbd57f3d10b8bcd4ff95363f67e06e2762b5e814fe9c9410e"
        bytes:  9880512
    input:
      shape:  [1, 3, -1, -1]
      pixfmt: bgr
      dtype:  f32
      preprocess:
        scale: [0.00392156862745098, 0.00392156862745098, 0.00392156862745098]
        mean:  [0.485, 0.456, 0.406]
        std:   [0.229, 0.224, 0.225]
        resize: {mode: limit_max_side, limit: 960, multiple_of: 32}
    output:
      type: db_probability_map
      postprocess:
        thresh:         0.2
        box_thresh:     0.4
        unclip_ratio:   1.4
        max_candidates: 3000

  - id: text_detect.medium
    task: text_detect
    tier: medium
    arch: pp_ocrv6_det
    license: Apache-2.0
    paper: "PP-OCRv6, arXiv:2606.13108"
    files:
      onnx:
        url:    "${hf}/PP-OCRv6_medium_det_onnx/resolve/main/inference.onnx"
        sha256: "eb13b44b25bb36f89528b68720af8a61d9cf381176107f465db1757b65d086e1"
        bytes:  62032837
    input:
      shape:  [1, 3, -1, -1]
      pixfmt: bgr
      dtype:  f32
      preprocess:
        scale: [0.00392156862745098, 0.00392156862745098, 0.00392156862745098]
        mean:  [0.485, 0.456, 0.406]
        std:   [0.229, 0.224, 0.225]
        resize: {mode: limit_max_side, limit: 960, multiple_of: 32}
    output:
      type: db_probability_map
      postprocess:
        thresh:         0.2
        box_thresh:     0.4
        unclip_ratio:   1.4
        max_candidates: 3000

  # ─── Text recognition (PP-OCRv6 rec, CTC head) ──────────────────────
  #
  # Input  "x"            f32 [N, 3, 48, W]  — height FIXED at 48
  # Output "fetch_name_0" f32 [N, T, 6906]   — T ≈ W/8
  #
  # 6906 = 1 CTC blank at index 0 + 6905 characters, so charset entry i
  # maps to class i+1. PaddleOCR's CTCLabelDecode uses the same convention.

  - id: text_recognize.tiny
    task: text_recognize
    tier: tiny
    arch: pp_ocrv6_rec
    license: Apache-2.0
    paper: "PP-OCRv6, arXiv:2606.13108"
    files:
      onnx:
        url:    "${hf}/PP-OCRv6_tiny_rec_onnx/resolve/main/inference.onnx"
        sha256: "9ef676d6ed3c88256a2d92c640c44f25b0c40947e111b14b8be8f594091563e6"
        bytes:  4462639
    input:
      shape:  [-1, 3, 48, -1]
      pixfmt: bgr
      dtype:  f32
      preprocess:
        height:    48
        max_width: 1200
        scale: [0.00392156862745098, 0.00392156862745098, 0.00392156862745098]
        mean:  [0.5, 0.5, 0.5]
        std:   [0.5, 0.5, 0.5]
    output:
      type: ctc_logits
      postprocess:
        blank_index: 0
        num_classes: 6906

  - id: text_recognize.small
    task: text_recognize
    tier: small
    arch: pp_ocrv6_rec
    license: Apache-2.0
    paper: "PP-OCRv6, arXiv:2606.13108"
    files:
      onnx:
        url:    "${hf}/PP-OCRv6_small_rec_onnx/resolve/main/inference.onnx"
        sha256: "5435fd747c9e0efe15a96d0b378d5bd157e9492ed8fd80edf08f30d02fa24634"
        bytes:  21159378
    input:
      shape:  [-1, 3, 48, -1]
      pixfmt: bgr
      dtype:  f32
      preprocess:
        height:    48
        max_width: 1200
        scale: [0.00392156862745098, 0.00392156862745098, 0.00392156862745098]
        mean:  [0.5, 0.5, 0.5]
        std:   [0.5, 0.5, 0.5]
    output:
      type: ctc_logits
      postprocess:
        blank_index: 0
        num_classes: 6906

  - id: text_recognize.medium
    task: text_recognize
    tier: medium
    arch: pp_ocrv6_rec
    license: Apache-2.0
    paper: "PP-OCRv6, arXiv:2606.13108"
    files:
      onnx:
        url:    "${hf}/PP-OCRv6_medium_rec_onnx/resolve/main/inference.onnx"
        sha256: "9c09abf0957f7968c7586464b7397b84ad2387a0497a351af40e9acc71b673ba"
        bytes:  76554979
    input:
      shape:  [-1, 3, 48, -1]
      pixfmt: bgr
      dtype:  f32
      preprocess:
        height:    48
        max_width: 1200
        scale: [0.00392156862745098, 0.00392156862745098, 0.00392156862745098]
        mean:  [0.5, 0.5, 0.5]
        std:   [0.5, 0.5, 0.5]
    output:
      type: ctc_logits
      postprocess:
        blank_index: 0
        num_classes: 6906

  # ─── Layout analysis (PP-DocLayoutV3) ───────────────────────────────
  #
  # Medium only. The 4.8 MB -S and 23.4 MB -M variants ship in Paddle
  # format (inference.json graph + inference.pdiparams weights) with no
  # official ONNX export, so tiny/small cannot claim layout support until
  # tools/paddle2onnx_layout.py lands and its output is verified
  # numerically equivalent. Until then the runtime's tier fallback sends
  # tiny/small layout requests here.

  - id: layout_detect.medium
    task: layout_detect
    tier: medium
    arch: pp_doclayout_v3
    license: Apache-2.0
    files:
      onnx:
        url:    "${hf}/PP-DocLayoutV3_onnx/resolve/main/inference.onnx"
        sha256: "45bf71750b00739a41fc209f132eb104a4d6b5bb29483c9078164d8b87cf28ba"
        bytes:  130502049
    input:
      shape:  [1, 3, 800, 800]
      pixfmt: rgb
      dtype:  f32
      preprocess:
        scale: [0.00392156862745098, 0.00392156862745098, 0.00392156862745098]
        mean:  [0.485, 0.456, 0.406]
        std:   [0.229, 0.224, 0.225]
        resize: {mode: fixed, target: [800, 800]}
    output:
      type: layout_regions
      postprocess:
        score_thresh: 0.5
        nms_iou:      0.5
